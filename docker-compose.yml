version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: foodgh_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: food_ordering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: foodgh_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: food_ordering
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: foodgh_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  migrate-and-seed:
    build: .
    container_name: foodgh_seed
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: food_ordering
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: foodgh_jwt_secret_change_in_production
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node config/migrate.js && node seeds/seed.js"

volumes:
  pgdata:
