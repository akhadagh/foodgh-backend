services:
  - type: web
    name: foodgh-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodgh-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://your-frontend-url.onrender.com
    healthCheckPath: /api/health

databases:
  - name: foodgh-db
    plan: free
    databaseName: food_ordering
    ipAllowList: []
